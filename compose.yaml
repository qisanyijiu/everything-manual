x-application: &application
  image: ${EM_IMAGE:-everything-manual:local}
  platform: ${EM_DOCKER_PLATFORM:-linux/amd64}
  pull_policy: never

services:
  # Compose file secrets do not reliably implement uid/gid/mode on local bind
  # mounts. The helper reads 0600 host files during bootstrap, then drops root.
  # Keeping it alive preserves the shared tmpfs while the HTTP service restarts.
  prepare:
    <<: *application
    user: "0:0"
    command: ["prepare-secrets"]
    environment:
      EM_RUNTIME_UID: ${EM_RUNTIME_UID:-10001}
      EM_RUNTIME_GID: ${EM_RUNTIME_GID:-10001}
    secrets:
      - admin_password
      - master_key
    volumes:
      - ${EM_DATA_PATH:-manual-data}:/data
      - ${EM_RUNTIME_CONFIG_PATH:-manual-config}:/runtime-config
      - private-runtime:/run/private
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER, DAC_OVERRIDE, SETUID, SETGID]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    stop_grace_period: 10s
    healthcheck:
      test: ["CMD-SHELL", "test -s /run/private/master.key && test -s /run/private/password.txt"]
      interval: 5s
      timeout: 2s
      start_period: 5s
      retries: 6

  manual:
    <<: *application
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    user: "${EM_RUNTIME_UID:-10001}:${EM_RUNTIME_GID:-10001}"
    depends_on:
      prepare:
        condition: service_healthy
    environment:
      EM_PUBLIC_ORIGIN: ${EM_PUBLIC_ORIGIN:-http://127.0.0.1:8080}
      EM_PROVIDER_OVERRIDES_DIR: /runtime-config
      EM_SECRETS_BACKEND: file
      EM_SECRETS_MASTER_KEY_FILE: /run/private/master.key
      EM_PRICE_CATALOG_PATH: ${EM_CONTAINER_PRICE_CATALOG_PATH:-}
    configs:
      - source: runtime_config
        target: /etc/everything-manual/config.toml
    volumes:
      - ${EM_DATA_PATH:-manual-data}:/data
      - ${EM_RUNTIME_CONFIG_PATH:-manual-config}:/runtime-config
      - private-runtime:/run/private:ro
    ports:
      - "127.0.0.1:${EM_HTTP_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    stop_grace_period: 60s

  proxy:
    image: ${EM_PROXY_IMAGE:-nginx:1.28-alpine}
    platform: ${EM_DOCKER_PLATFORM:-linux/amd64}
    user: "101:101"
    entrypoint: ["nginx"]
    command: ["-c", "/etc/nginx/nginx.conf", "-g", "daemon off;"]
    network_mode: service:manual
    depends_on:
      manual:
        condition: service_healthy
    configs:
      - source: proxy_config
        target: /etc/nginx/nginx.conf
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "2", "-O", "/dev/null", "http://127.0.0.1:8080/api/v1/health/ready"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 6

secrets:
  admin_password:
    file: ${EM_ADMIN_PASSWORD_FILE:?Use scripts/start-project.sh or provide a private password file}
  master_key:
    file: ${EM_MASTER_KEY_FILE:?Use scripts/start-project.sh or provide a private 64-hex master-key file}

configs:
  runtime_config:
    file: ${EM_CONFIG_FILE:-./docker/config.toml}
  proxy_config:
    file: ./docker/nginx.conf

volumes:
  manual-data:
  manual-config:
  private-runtime:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=1m,mode=0700"
