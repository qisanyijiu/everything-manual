x-application: &application
  image: ${EM_IMAGE:?Set the immutable application image reference from the release manifest}
  platform: ${EM_DOCKER_PLATFORM:-linux/amd64}
  pull_policy: never

services:
  prepare:
    <<: *application
    user: "0:0"
    command: ["prepare-secrets"]
    environment:
      EM_RUNTIME_UID: "10001"
      EM_RUNTIME_GID: "10001"
    secrets: [admin_password, master_key]
    volumes:
      - ${EM_DATA_PATH:-manual-data}:/data
      - ${EM_RUNTIME_CONFIG_PATH:-manual-config}:/runtime-config
      - private-runtime:/run/private
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER, DAC_OVERRIDE, SETUID, SETGID]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    stop_grace_period: 10s
    healthcheck:
      test: ["CMD-SHELL", "test -s /run/private/master.key && test -s /run/private/password.txt"]
      interval: 5s
      timeout: 2s
      start_period: 5s
      retries: 6

  prepare-tls:
    <<: *application
    user: "0:0"
    entrypoint: ["/bin/sh", "/etc/everything-manual/prepare-tls.sh"]
    environment:
      EM_PUBLIC_ORIGIN: ${EM_PUBLIC_ORIGIN:?Set the actual HTTPS origin including a nondefault port}
    secrets: [tls_certificate, tls_private_key]
    configs:
      - source: tls_prepare_script
        target: /etc/everything-manual/prepare-tls.sh
    volumes:
      - tls-runtime:/run/tls
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER, DAC_OVERRIDE, SETUID, SETGID]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    stop_grace_period: 10s
    healthcheck:
      test: ["CMD-SHELL", "test -s /run/tls/fullchain.pem && test -s /run/tls/privkey.pem"]
      interval: 5s
      timeout: 2s
      start_period: 5s
      retries: 6

  manual:
    <<: *application
    user: "10001:10001"
    depends_on:
      prepare:
        condition: service_healthy
    environment:
      EM_PUBLIC_ORIGIN: ${EM_PUBLIC_ORIGIN:?Set the actual HTTPS origin including a nondefault port}
      EM_LISTEN: 127.0.0.1:8081
      EM_TRUSTED_PROXY_CIDRS: 127.0.0.1/32
      EM_SESSION__COOKIE_SECURE: always
      EM_CONFIG: /etc/everything-manual/config.toml
      EM_DATA_DIR: /data
      EM_PROVIDER_OVERRIDES_DIR: /runtime-config
      EM_SECRETS_BACKEND: file
      EM_SECRETS_MASTER_KEY_FILE: /run/private/master.key
      EM_PRICE_CATALOG_PATH: ${EM_CONTAINER_PRICE_CATALOG_PATH:-}
    configs:
      - source: runtime_config
        target: /etc/everything-manual/config.toml
    volumes:
      - ${EM_DATA_PATH:-manual-data}:/data
      - ${EM_RUNTIME_CONFIG_PATH:-manual-config}:/runtime-config
      - private-runtime:/run/private:ro
    ports:
      - "${EM_HTTPS_BIND:-127.0.0.1}:${EM_HTTPS_PORT:-8443}:8443"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    stop_grace_period: 60s

  proxy:
    image: ${EM_PROXY_IMAGE:?Set the immutable proxy image reference from the release manifest}
    platform: ${EM_DOCKER_PLATFORM:-linux/amd64}
    pull_policy: never
    user: "101:101"
    entrypoint: ["nginx"]
    command: ["-c", "/etc/nginx/nginx.conf", "-g", "daemon off;"]
    network_mode: service:manual
    depends_on:
      manual:
        condition: service_healthy
      prepare-tls:
        condition: service_healthy
    configs:
      - source: proxy_config
        target: /etc/nginx/nginx.conf
    volumes:
      - tls-runtime:/run/tls:ro
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "2", "-O", "/dev/null", "http://127.0.0.1:8080/api/v1/health/ready"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 6

secrets:
  admin_password:
    file: ${EM_ADMIN_PASSWORD_FILE:?Set the private administrator initialization password file}
  master_key:
    file: ${EM_MASTER_KEY_FILE:?Set the private 64-hex master-key file}
  tls_certificate:
    file: ${EM_TLS_CERT_FILE:?Set the certificate fullchain PEM file}
  tls_private_key:
    file: ${EM_TLS_KEY_FILE:?Set the private unencrypted TLS PEM key file}

configs:
  runtime_config:
    file: ./config.toml
  proxy_config:
    file: ./nginx.production.conf
  tls_prepare_script:
    file: ./prepare-tls.sh

volumes:
  manual-data:
  manual-config:
  private-runtime:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=1m,mode=0700"
  tls-runtime:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=1m,mode=0700"
